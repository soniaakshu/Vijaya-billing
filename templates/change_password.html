<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Vijaya Billing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .password-box {
            width: 400px;
            padding: 35px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h1 {
            margin: 0 0 25px;
            color: #1e40af;
        }

        label {
            display: block;
            text-align: left;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            padding: 10px;

            border-radius: 6px;

            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .back {
            display: block;
            margin-top: 20px;

            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="password-box">

        <h1>Change Password</h1>

        <form method="POST">

            <label for="current_password">
                Current Password
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                required
            >

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                required
                minlength="8"
            >

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
                minlength="8"
            >

            <button type="submit">
                CHANGE PASSWORD
            </button>

        </form>

        {% if error %}
        <div class="message error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="message success">
            {{ success }}
        </div>
        {% endif %}

        <a class="back" href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
